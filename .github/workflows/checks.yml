name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint + format
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      # The route tree is committed, and the VITE PLUGIN is what generates
      # it — the standalone `tsr generate` CLI emits a subtly different file
      # (it omits the `Register` declaration that types the router and `ssr`).
      # So this has to run AFTER the build, comparing against what the build
      # actually produced.
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
