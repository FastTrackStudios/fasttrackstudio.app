# Deploys fasttrackstudio.app.
#
#   nix build .#image -> registry.starcommand.live:30050/fts-www:{latest,sha-…}
#
# Runs on the SELF-HOSTED runner labeled `nix-host` (THEBATTLESHIP): the
# in-cluster registry is LAN-only and unreachable from GitHub-hosted runners.
#
# NO DOCKER ANYWHERE. That runner executes as the `github-runner` user, which
# has no docker on PATH and is not in the `docker` group — and putting it
# there would hand CI effectively-root access to the workstation. So the
# image is built as an ordinary Nix derivation (dockerTools.streamLayeredImage,
# see nix/image.nix) and streamed straight into skopeo. Same shape as the
# FastTrackStudio monorepo's fts-site deploy. The repo's Dockerfile still
# works for local runs and non-Nix hosts; it just is not what CI uses.
#
# argocd-image-updater (digest strategy on the `latest` tag) rolls the
# Deployment; "Verify live" then polls /version.json until the cluster serves
# THIS commit, so a green run means deployed, not merely pushed.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-push; queue instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.starcommand.live:30050
  IMAGE: fts-www
  # Newer skopeo rejects the host's v1 registries.conf; we name the registry
  # explicitly everywhere, so use an empty (valid) config.
  CONTAINERS_REGISTRIES_CONF: /dev/null
  # Polled by Verify live. The apex now resolves to the cluster edge and the
  # Argo Application serves this chart there (see the cutover note in
  # ~/.starcommand/modules/services/fasttrackstudio-site), so this polls the
  # real address rather than the LAN wildcard the scaffold used.
  VERIFY_URL: https://fasttrackstudio.app

jobs:
  deploy:
    runs-on: [self-hosted, nix-host]
    environment:
      name: production
      url: https://fasttrackstudio.app
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # bun + node come from the flake's devShell, so CI and a local
      # `nix develop` build with the same versions. vite runs under NODE, not
      # bun: building under bun resolves the `bun` export condition and bakes
      # srvx's Bun server adapter into .output, which then dies with "Bun is
      # not defined" under the node runtime in the image.
      - name: Build app
        run: |
          set -euo pipefail
          nix develop --command bash -euo pipefail -c '
            bun install --frozen-lockfile
            node node_modules/vite/bin/vite.js build
          '

      - name: Build image
        id: image
        env:
          FTS_OUTPUT: ${{ github.workspace }}/.output
          FTS_REV: ${{ github.sha }}
          FTS_TAG: latest
          FTS_BUILD_TIME: ${{ steps.tags.outputs.built_at }}
        run: |
          set -euo pipefail
          # --impure: nix/image.nix reads the built .output path from the
          # environment. Everything else about the image is pinned by flake.lock.
          streamer="$(nix build --impure --no-link --print-out-paths .#image)"
          echo "streamer=$streamer" >> "$GITHUB_OUTPUT"

      - name: Push image
        run: |
          set -euo pipefail
          "${{ steps.image.outputs.streamer }}" | nix develop --command skopeo \
            --insecure-policy copy --dest-tls-verify=false --dest-no-creds \
            docker-archive:/dev/stdin \
            "docker://${REGISTRY}/${IMAGE}:latest"
          nix develop --command skopeo \
            --insecure-policy copy \
            --src-tls-verify=false --src-no-creds \
            --dest-tls-verify=false --dest-no-creds \
            "docker://${REGISTRY}/${IMAGE}:latest" \
            "docker://${REGISTRY}/${IMAGE}:${{ steps.tags.outputs.sha }}"

      - name: Verify live
        run: |
          want="${GITHUB_SHA}"
          echo "waiting for ${VERIFY_URL} to serve ${want}"
          for i in $(seq 1 60); do
            rev="$(curl -sf --max-time 10 "${VERIFY_URL}/version.json" \
              | sed -n 's/.*"rev":"\([^"]*\)".*/\1/p' || true)"
            echo "  poll $i: rev=${rev:-?}"
            if [ "$rev" = "$want" ]; then
              echo "LIVE: ${VERIFY_URL} serves ${want}"
              exit 0
            fi
            sleep 15
          done
          echo "TIMED OUT: ${VERIFY_URL} never served ${want}"
          echo "check argocd-image-updater and the fts-www Application"
          exit 1
