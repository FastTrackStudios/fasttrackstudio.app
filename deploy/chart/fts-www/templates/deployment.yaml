apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: fts-www
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fts-www
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fts-www
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: web
          {{- /* A repository containing "/" is used verbatim — that's what
               argocd-image-updater writes back (full registry path); a bare
               name gets image.registry prepended. */}}
          {{- if contains "/" .Values.image.repository }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- else }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: WAITLIST_FILE
              value: /data/waitlist.jsonl
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /version.json is a cheap server route that touches no data.
          livenessProbe:
            httpGet:
              path: /version.json
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /version.json
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
