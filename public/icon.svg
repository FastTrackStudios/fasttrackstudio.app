<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- FastTrackStudio mark: the stage. A dark plate, three beams from a truss —
       Signal green, Session blue, Ignition amber — landing on a lit deck.
       Same plate as the product icons, so it sits beside them as family. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="0.55" stop-color="#151517"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd673" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2fd673" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="session" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2e9bff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ignition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a2b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#plate)"/>
    <!-- truss -->
    <rect x="128" y="176" width="768" height="20" rx="10" fill="#ffffff" fill-opacity="0.16"/>
    <!-- beams: narrow at the fixture, wide on the deck. Screen so overlaps add. -->
    <g style="mix-blend-mode:screen">
      <polygon points="292,196 344,196 484,836 132,836" fill="url(#signal)"/>
      <polygon points="486,196 538,196 700,836 324,836" fill="url(#session)"/>
      <polygon points="680,196 732,196 892,836 540,836" fill="url(#ignition)"/>
    </g>
    <!-- deck -->
    <rect x="0" y="836" width="1024" height="188" fill="url(#deck)"/>
    <rect x="0" y="832" width="1024" height="8" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
